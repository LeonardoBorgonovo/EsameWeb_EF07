<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗓️Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>Task Manager</header>

    <div class="taskCreator">
        <!-- Creazione di un task -->
        <input type="text" id="task-input" placeholder="Inserisci un'attività...">
        <button id="add-task-button">Aggiungi</button>

    </div>

    <br><br>

    <div class="taskFilter">

        <!-- Filtro dei task -->
         <label>Filtra per stato</label>
            <select id="filter">
                <option value="all">Tutti</option>
                <option value="todo">Da fare</option>
                <option value="inprogress">In corso</option>
                <option value="done">Fatti</option>
            </select>

    </div>

    <br><br>

    <div class="taskFinder">

        <!-- Ricerca di un task -->
        <input type="text" id="search" placeholder="Cerca attività">
        <button id="find">Cerca</button>

    </div>

</body>
</html>
