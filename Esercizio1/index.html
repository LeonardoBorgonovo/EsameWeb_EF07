<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗓️Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>Task Manager</header>

    <div class="taskCreator">

        <!-- Creazione di un task -->
        <input type="text" id="task-input" placeholder="Inserisci un'attività...">
        <button id="add-task-button">Aggiungi</button>

    </div>

    <br><br>

    <div class="filter-search-container">
        
        <div class="search-container">
          <input type="text" id="search-input" placeholder="Ricerca attività ">
        </div>

        <div class="filter-container">
            <h3>Filtra per stato:</h3>
            <label><input type="checkbox" value="completato"> Completato</label><br>
            <label><input type="checkbox" value="incorso"> In corso</label><br>
            <label><input type="checkbox" value="dafare"> Da fare</label><br>
            <button id="apply-filters">Applica</button>
            <button id="clear-filters">Cancella filtri</button>
          </div>

    </div>

</body>
</html>
