<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Attività</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gestione Attività</h1>

        <div class="input-section">
            <input type="text" id="new-task" placeholder="Aggiungi una nuova attività">
            <button id="add-task-btn">Aggiungi</button>
        </div>

        <div class="filter-section">
            <label for="filter-status">Filtra per stato:</label>
            <select id="filter-status">
                <option value="all">Tutti</option>
                <option value="da-fare">Da Fare</option>
                <option value="in-corso">In Corso</option>
                <option value="completata">Completata</option>
            </select>

            <div class="search-input">
                <input type="text" id="search-task" placeholder="Cerca attività...">
            </div>
        </div>

        <ul id="task-list">
            </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
